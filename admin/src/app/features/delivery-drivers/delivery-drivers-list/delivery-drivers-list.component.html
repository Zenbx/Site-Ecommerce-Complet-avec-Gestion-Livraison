<div class="drivers-wrapper">

  <header class="top-bar">
    <div class="top-bar-left">
      <h1>Livreurs</h1>
      <span class="divider">|</span>
      <span class="context">{{ filteredDrivers().length }} actifs</span>
    </div>

    <div class="top-bar-right">
      <div class="search-box">
        <i class="material-icons">search</i>
        <input type="text" placeholder="Rechercher..." (input)="onSearch($event)">
      </div>
      <button class="fab-btn" (click)="createDriver()" title="Ajouter un livreur">
        <i class="material-icons">add</i>
      </button>
    </div>
  </header>

  <div class="dashboard-content">
    <div class="filter-bar">
      <button class="chip" [class.active]="filter === 'all'" (click)="setFilter('all')">Tous</button>
      <button class="chip" [class.active]="filter === 'available'" (click)="setFilter('available')">Disponibles</button>
    </div>

    <div class="driver-grid">
      <div class="driver-card" *ngFor="let driver of filteredDrivers()">

        <div class="card-header">
          <div class="avatar-container">
            <img *ngIf="driver.photo_url" [src]="driver.photo_url" class="driver-photo">
            <div *ngIf="!driver.photo_url" class="avatar-placeholder">
              {{ driver.name.charAt(0) }}
            </div>
            <div class="status-dot" [class.online]="driver.is_available"></div>
          </div>

          <div class="actions-menu">
            <button class="icon-btn" (click)="editDriver(driver)"><i class="material-icons">edit</i></button>
            <button class="icon-btn delete" (click)="deleteDriver(driver)"><i class="material-icons">delete</i></button>
          </div>
        </div>

        <div class="card-body">
          <h3 class="driver-name">{{ driver.name }}</h3>
          <p class="driver-id"> {{ driver.is_available ? 'Disponible' : 'Indisponible' }}</p>

          <div class="contact-info">
            <div class="info-row">
              <i class="material-icons">email</i>
              <span>{{ driver.email }}</span>
            </div>
          </div>
        </div>

        <div class="card-footer">
          <button class="icon-action" (click)="editDriver(driver)" title="Modifier">
            <i class="material-icons">edit</i>
          </button>
          <button class="icon-action delete" (click)="deleteDriver(driver)" title="Supprimer">
            <i class="material-icons">delete</i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
