<div class="form-page-wrapper">
  
  <header class="simple-header">
    <button class="back-link" (click)="goBack()">
      <i class="material-icons">arrow_back</i>
      Retour à la liste
    </button>
  </header>

  <main class="form-container">
    <div class="form-card">
      <div class="card-title">
        <h1>{{ isEditMode ? 'Modifier le livreur' : 'Nouveau livreur' }}</h1>
        <p class="subtitle">Saisissez les informations du collaborateur</p>
      </div>

      <div *ngIf="loading" class="spinner-center"><div class="spinner"></div></div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
        
        <section class="form-section">
          <h3 class="section-label">Identité</h3>
          
          <div class="input-group">
            <label>Nom complet</label>
            <input type="text" formControlName="driverName" class="google-input" [class.error]="hasError('driverName', 'required')">
            <span class="error-text" *ngIf="hasError('driverName', 'required')">{{ getErrorMessage('driverName') }}</span>
          </div>

          <div class="row-2-col">
            <div class="input-group">
              <label>Email</label>
              <input type="email" formControlName="email" class="google-input" [class.error]="hasError('email', 'required')">
            </div>
            <div class="input-group">
              <label>Téléphone</label>
              <input type="tel" formControlName="phone" class="google-input" [class.error]="hasError('phone', 'required')">
            </div>
          </div>
        </section>

        <hr class="divider">

        <section class="form-section">
          <h3 class="section-label">Véhicule & Permis</h3>
          
          <div class="row-2-col">
            <div class="input-group">
              <label>Type de véhicule</label>
              <select formControlName="vehicleType" class="google-input">
                <option value="Scooter">Scooter</option>
                <option value="Van">Fourgonnette</option>
                <option value="Truck">Camion</option>
              </select>
            </div>
            <div class="input-group">
              <label>Plaque d'immatriculation</label>
              <input type="text" formControlName="vehiclePlate" class="google-input">
            </div>
          </div>

          <div class="input-group">
            <label>Numéro de permis</label>
            <input type="text" formControlName="licenseNumber" class="google-input">
          </div>
        </section>

        <div class="form-actions">
          <button type="button" class="btn-cancel" (click)="goBack()">Annuler</button>
          <button type="submit" class="btn-save" [disabled]="!isFormValid() || submitting">
            {{ isEditMode ? 'Enregistrer' : 'Créer' }}
          </button>
        </div>

      </form>
    </div>
  </main>
</div>
