<!-- Container principal de la carte -->
<div class="map-wrapper" [class.loading]="isLoading">

  <!-- ============================================================================
       CARTE LEAFLET - Container
       ============================================================================ -->
  <div class="map-container-wrapper">
    <!-- Container de la carte (Leaflet s'y attachera) -->
    <div #mapContainer class="map-container"></div>

    <!-- ============================================================================
         OVERLAYS - Affichés au-dessus de la carte
         ============================================================================ -->

    <!-- Overlay de chargement -->
    <div class="map-overlay loading-overlay" *ngIf="isLoading">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Chargement de la carte...</p>
      </div>
    </div>

    <!-- Overlay d'erreur -->
    <div class="map-overlay error-overlay" *ngIf="error && !isLoading">
      <div class="error-content">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <h3>Erreur de chargement</h3>
        <p>{{ error }}</p>
        <button class="retry-btn" (click)="refresh()">
          Réessayer
        </button>
      </div>
    </div>

    <!-- Overlay "Aucun livreur" -->
    <div class="map-overlay empty-overlay" *ngIf="!isLoading && !error && onlineCount === 0 && offlineCount === 0">
      <div class="empty-content">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" />
          <path d="M12 12v4M12 8h.01" />
        </svg>
        <h3>Aucun livreur actif</h3>
        <p>Aucun livreur n'a de position GPS enregistrée pour le moment.</p>
      </div>
    </div>

    <!-- Légende de la carte (mode overview) -->
    <div class="map-legend" *ngIf="mode === 'overview' && !isLoading && !error">
      <h4>Légende</h4>
      <div class="legend-items">
        <div class="legend-item">
          <span class="legend-marker online"></span>
          <span class="legend-label">Livreur en ligne</span>
        </div>
        <div class="legend-item">
          <span class="legend-marker offline"></span>
          <span class="legend-label">Livreur hors ligne</span>
        </div>
        <div class="legend-item" *ngIf="showDeliveryDestinations">
          <span class="legend-marker delivery"></span>
          <span class="legend-label">Destination de livraison</span>
        </div>
      </div>
    </div>

    <!-- Info tracking (mode tracking) -->
    <div class="tracking-info" *ngIf="mode === 'tracking' && deliveryPersonId">
      <div class="tracking-card">
        <h4>Suivi en temps réel</h4>
        <div class="tracking-details">
          <div class="tracking-detail">
            <span class="label">Distance restante:</span>
            <span class="value">--</span>
          </div>
          <div class="tracking-detail">
            <span class="label">Temps estimé:</span>
            <span class="value">--</span>
          </div>
          <div class="tracking-detail">
            <span class="label">Arrivée prévue:</span>
            <span class="value">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================================
     STYLES INLINE POUR L'ANIMATION PULSE (injecté dynamiquement)
     ============================================================================ -->
  <style>
    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
