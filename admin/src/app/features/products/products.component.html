<div class="products-dashboard">

	<!-- Onglets catégories -->
	<div class="categories-tabs">
		<button *ngFor="let cat of categories" (click)="selectedCategoryId = cat.id"
			[class.active]="selectedCategoryId === cat.id">
			{{ cat.name }}
		</button>
		<button (click)="selectedCategoryId = null" [class.active]="selectedCategoryId === null">
			Tous
		</button>
	</div>

	<!-- Grille de produits -->
	<div class="products-grid">
		<div class="product-card" *ngFor="let product of filteredProducts()">

			<img [src]="product.image_url" alt="{{ product.name }}" class="product-image" />

			<div class="product-info">
				<h3>{{ product.name }}</h3>
				<p class="description">{{ product.description }}</p>
				<p class="price">{{ product.price | currency:'EUR' }}</p>
				<p class="quantity">Quantité: {{ product.quantity }}</p>
				<p class="status" [class.active]="product.is_active" [class.inactive]="!product.is_active">
					{{ product.is_active ? 'Actif' : 'Inactif' }}
				</p>
			</div>

			<div class="product-actions">
				<button class="icon-action" (click)="startEdit(product)" title="Modifier">
					<i class="material-icons">edit</i>
				</button>
				<button class="icon-action delete" (click)="deleteProduct(product)" title="Supprimer">
					<i class="material-icons">delete</i>
				</button>
			</div>

		</div>

		<!-- Message si aucun produit -->
		<p class="empty-msg" *ngIf="filteredProducts().length === 0">
			Aucun produit dans cette catégorie
		</p>
	</div>
</div>
