<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Connexion</h1>
      <p>Entrez vos identifiants</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control"
          [class.is-invalid]="submitted && f['email'].errors" placeholder="votre@email.com">
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
          <span *ngIf="f['email'].errors['required']">Email requis</span>
          <span *ngIf="f['email'].errors['email']">Email invalide</span>
        </div>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" class="form-control"
          [class.is-invalid]="submitted && f['password'].errors" placeholder="••••••">
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <span *ngIf="f['password'].errors['required']">Mot de passe requis</span>
          <span *ngIf="f['password'].errors['minlength']">Minimum 6 caractères</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="register-link">
      <p>Pas encore inscrit ? <a routerLink="/register">Créer un compte</a></p>
    </div>
  </div>
</div>
