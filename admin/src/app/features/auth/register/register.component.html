<div class="register-container">
  <div class="register-card">
    <h2>Créer un compte</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" formControlName="name" class="form-control"
          [class.is-invalid]="submitted && f['name'].errors" placeholder="Nom et prénom">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control"
          [class.is-invalid]="submitted && f['email'].errors" placeholder="email@example.com">
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" class="form-control"
          [class.is-invalid]="submitted && f['password'].errors" placeholder="••••••">
      </div>

      <div class="form-group">
        <label>Rôle</label>
        <select formControlName="role" class="form-control"
          [class.is-invalid]="submitted && f['role'].errors">
          <option value="">Sélectionner un rôle</option>
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
      </div>

      <button type="submit" class="btn btn-success btn-block" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : 'S’inscrire' }}
      </button>
    </form>
  </div>
</div>
