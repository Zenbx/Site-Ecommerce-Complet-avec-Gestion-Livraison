<nav class="sidebar">

  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-symbol">G</div>
      <span class="logo-text">Logistique<span>Pro</span></span>
    </div>
  </div>

  <div class="sidebar-nav">
    <ul>
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-link">
          <span class="material-icons">{{ item.icon }}</span>
          <span class="label">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">
        {{ adminProfile?.name?.charAt(0) }}
      </div>
      <div class="user-details">
        <span class="user-name">{{ adminProfile?.name }}</span>
        <span class="user-role">{{ adminProfile?.role }}</span>
      </div>
    </div>

    <button class="logout-btn" (click)="logout()">
      <i class="material-icons">logout</i>
      <span>Déconnexion</span>
    </button>
  </div>
</nav>
